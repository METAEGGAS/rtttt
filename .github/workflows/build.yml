name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev wget \
            openjdk-8-jdk || true

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache Buildozer global
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer project
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: buildozer-project-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Pre-setup Android SDK tools
        run: |
          # Install cmdline-tools manually
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          
          # Symlink to tools (Buildozer expects this)
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          cp ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/* \
             ~/.buildozer/android/platform/android-sdk/tools/bin/ || true
          
          # Accept licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "79120722343a6f314e07f004d70f083037b032e1" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Accept Android SDK License
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.android/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.android/android-sdk-license
          echo "79120722343a6f314e07f004d70f083037b032e1" >> ~/.android/android-sdk-license

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quotex-apk
          path: bin/*.apk
          if-no-files-found: error
